<svg viewBox="0 0 1000 1000" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sunGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFA500;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF9933;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="leafGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#138808;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#228B22;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Sun -->
  <circle cx="500" cy="380" r="120" fill="url(#sunGradient)" filter="url(#glow)" />
  
  <!-- Sun rays -->
  <g stroke="url(#sunGradient)" stroke-width="30" stroke-linecap="round" stroke-opacity="0.9">
    <line x1="500" y1="180" x2="500" y2="80" />
    <line x1="500" y1="680" x2="500" y2="780" />
    <line x1="300" y1="380" x2="160" y2="380" />
    <line x1="700" y1="380" x2="840" y2="380" />
    <line x1="320" y1="210" x2="220" y2="110" />
    <line x1="680" y1="550" x2="780" y2="650" />
    <line x1="680" y1="210" x2="780" y2="110" />
    <line x1="320" y1="550" x2="220" y2="650" />
  </g>
  
  <!-- Cloud -->
  <path d="M 350 480 Q 350 420 400 420 Q 410 380 460 380 Q 510 380 510 440 Q 560 440 600 480 Q 600 540 540 560 L 360 560 Q 350 540 350 480 Z" fill="white" opacity="0.95" />
  
  <!-- Leaf -->
  <g transform="translate(520, 510)">
    <path d="M 0 0 Q 40 -20 60 40 Q 50 60 20 70 Q -10 60 0 0 Z" fill="url(#leafGradient)" stroke="url(#leafGradient)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 10 15 Q 25 10 35 30" stroke="white" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.6" />
  </g>
</svg>
